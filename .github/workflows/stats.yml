name: refresh profile stats

# Regenerates assets/signal.svg, assets/activity.svg and the "lately pushed to" line in
# README.md from the GitHub API. The ASCII animations are not built here; they are
# rendered locally (see scripts/animations/README.md) and committed.

on:
  schedule:
    - cron: "23 3 * * *"   # once a day, 03:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # stdlib only, so the runner's own python3 is enough. If the API fails the script
      # exits before writing, the job fails visibly, and the last good assets stay live.
      - name: Generate stats
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/signal.svg assets/activity.svg README.md
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "† refresh stats"
          git pull --rebase --autostash origin main
          git push
