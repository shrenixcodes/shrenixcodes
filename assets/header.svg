<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.petal{animation:fall linear infinite;opacity:.75}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(14px,90px) rotate(90deg)}50%{transform:translate(-8px,180px) rotate(180deg)}75%{transform:translate(12px,270px) rotate(270deg)}100%{transform:translate(0,370px) rotate(360deg)}}
.g1{animation:j1 3.2s steps(1) infinite;opacity:.8}
.g2{animation:j2 3.2s steps(1) infinite;opacity:.8}
@keyframes j1{0%,8%,14%,62%,68%,100%{transform:translate(0,0)}9%{transform:translate(-4px,1px)}11%{transform:translate(3px,-2px)}63%{transform:translate(-6px,0)}65%{transform:translate(2px,1px)}}
@keyframes j2{0%,8%,14%,62%,68%,100%{transform:translate(0,0)}9%{transform:translate(4px,-1px)}11%{transform:translate(-3px,2px)}63%{transform:translate(6px,0)}65%{transform:translate(-2px,-1px)}}
.main{animation:flick 3.2s steps(1) infinite}
@keyframes flick{0%,9%,12%,63%,66%,100%{opacity:1}10%,64%{opacity:.35}}
.slice{animation:slice 3.2s steps(1) infinite}
@keyframes slice{0%,9%,13%,63%,67%,100%{transform:translate(0,0);opacity:0}10%{transform:translate(18px,0);opacity:1}12%{transform:translate(-12px,0);opacity:1}64%{transform:translate(-20px,0);opacity:1}66%{transform:translate(10px,0);opacity:1}}
.type{animation:type 3s steps(55) .6s both}
@keyframes type{from{width:0}to{width:495px}}
.cur{animation:move 3s steps(55) .6s both,blink .8s steps(1) infinite}
@keyframes move{from{transform:translateX(0)}to{transform:translateX(495px)}}
@keyframes blink{50%{opacity:0}}
.lace{animation:drift 30s linear infinite}
.lace2{animation:drift 30s linear infinite reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-171.6px)}}
.scan{animation:roll 1s linear infinite}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(4px)}}
.sp{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
</style>
