<svg xmlns="http://www.w3.org/2000/svg" width="900" height="92" viewBox="0 0 900 92"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}</style><text x="450.0" y="30" font-size="12.5" fill="#b8c2dc" text-anchor="middle" font-style="italic">「 it&#x27;s not a bug, it&#x27;s a side quest. 」</text><text x="450.0" y="52" font-size="12.5" fill="#5c6175" text-anchor="middle" font-style="italic">「 code is never finished. it just stops crashing long enough to push. 」</text><text x="450.0" y="74" font-size="12.5" fill="#5c6175" text-anchor="middle" font-style="italic">「 it works on my machine. we are not shipping my machine. 」</text></svg>